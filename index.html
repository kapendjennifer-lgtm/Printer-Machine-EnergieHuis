<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Energy Kiosk</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Archivo+Narrow:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>

<style>
  :root {
    --bg: #E8DCC4;
    --cabinet: #C97B5C;
    --cabinet-shadow: #9C5B40;
    --cabinet-trim: #F2E7CF;
    --screen-bg: #F4ECDB;
    --paper: #F8F2E2;
    --paper-edge: #E8DDC4;
    --ink: #2B2218;
    --ink-soft: #5A4A3A;
    --ink-faint: #8A7763;
    --accent-terra: #C95F3C;
    --accent-olive: #6E7E3F;
    --accent-mustard: #D6A732;
    --accent-brick: #A8493B;
    --brass: #B58A4E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 800px at 50% 30%, #F1E3C7, #E8DCC4 60%, #D6C7A8 100%);
    font-family: "Archivo Narrow", system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  /* soft paper grain on the entire page */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(rgba(80,55,30,0.04) 1px, transparent 1px),
      radial-gradient(rgba(80,55,30,0.03) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    pointer-events: none;
    z-index: 0;
  }
  #root { position: relative; z-index: 1; min-height: 100vh; }

  /* Responsive scaler — keeps the whole kiosk (incl. printer + caption) on
     screen on any viewport by JS-scaling a fixed-size stage. */
  .kiosk-stage-outer {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .kiosk-stage {
    /* width/height set inline by ResponsiveStage */
    transform-origin: center center;
    display: flex; flex-direction: row; align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 12px 0;
    position: relative;
  }
  .kiosk-column {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .kiosk-preview {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
    width: 340px;
    animation: preview-slide-in 520ms cubic-bezier(.2,.9,.3,1.05) both;
  }
  @keyframes preview-slide-in {
    from { opacity: 0; transform: translateX(-40px) rotate(-3deg); }
    to   { opacity: 1; transform: translateX(0)    rotate(-1deg); }
  }

  .display { font-family: "Bricolage Grotesque", serif; letter-spacing: -0.02em; }
  .hand { font-family: "Caveat", cursive; }
  .mono { font-family: "Special Elite", "Courier New", monospace; letter-spacing: 0.01em; }

  /* sr-only */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<script type="application/json" id="tweak-defaults">/*EDITMODE-BEGIN*/{
  "accent": "olive",
  "cabinetColor": "sage",
  "showStickers": true,
  "showGrain": true,
  "language": "English"
}/*EDITMODE-END*/</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="kiosk.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="receipt.jsx"></script>
<script type="text/babel" src="share-sheet.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
